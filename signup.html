<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <link rel="icon" type="image/png" href="photo/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="cinemax.css">
</head>
<body>

  <header class="top-bar">
    <div class="top-bar-inner">
      <a class="logo" href="index.html"><img class="logo-mark" src="photo/logo.png" alt="" width="49" height="44">CINEMAX</a>
      <input class="menu-checkbox" type="checkbox" id="menu-open" aria-label="Menu">
      <label class="menu-toggle" for="menu-open"><span></span></label>
      <div class="bar-nav">
        <nav class="menu">
          <a href="index.html#now-showing">Now Showing</a>
          <a href="index.html#coming-soon">Upcoming Shows</a>
        </nav>
        <div class="auth-buttons">
          <a class="button button-outline" href="signin.html">Sign In</a>
          <a class="button button-red" href="signup.html">Sign Up</a>
        </div>
      </div>
    </div>
  </header>

  <main class="form-page">
    <div class="form-card">

      <h1>Join CINEMAX</h1>
      <p class="form-intro">Create an account to start booking.</p>

      <p class="form-message hidden" id="form-message"></p>

      <form id="signup-form" novalidate>

        <div class="form-field">
          <label for="fullname">Full name</label>
          <input id="fullname" name="fullname" type="text"
                 placeholder="Juan Dela Cruz" autocomplete="name" required>
        </div>

        <div class="form-field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email"
                 placeholder="juandelacruz@gmail.com" autocomplete="email" required>
        </div>

        <div class="form-field">
          <label for="mobile">Mobile number</label>
          <input id="mobile" name="mobile" type="tel"
                 placeholder="0917 123 4567" autocomplete="tel">
        </div>

        <div class="form-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password"
                 placeholder="At least 8 characters" autocomplete="new-password" required>
        </div>

        <div class="form-field">
          <label for="confirm">Confirm password</label>
          <input id="confirm" name="confirm" type="password"
                 placeholder="Re-type your password" autocomplete="new-password" required>
        </div>

        <label class="agree-line">
          <input type="checkbox" id="agree" name="agree" required>
          <span>I agree to the <a href="terms.html">Terms of Service</a>.</span>
        </label>

        <button class="button button-red" type="submit" id="submit">Create Account</button>

      </form>

      <p class="form-switch">Already have an account? <a href="signin.html" id="signin-link">Sign In</a></p>

    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <a class="logo" href="index.html"><img class="logo-mark" src="photo/logo.png" alt="" width="49" height="44">CINEMAX</a>
      <p class="footer-text">
        Your next movie experience starts here. <br>
        Book your seats, enjoy your snacks, and let the show begin.
      </p>
      <p class="footer-copyright">&copy; 2026 Cinemax. All rights reserved.</p>
    </div>
  </footer>

</body>
</html>
