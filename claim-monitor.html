<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snacks Claim</title>
  <link rel="icon" type="image/png" href="photo/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="cinemax.css">
  <style>
    /* Snacks Claim monitor (claim-monitor.html): a screen at the snack
       counter, read from across the room, so everything is large and sizes with
       the screen. */

    /* Exactly the height of the screen, so the numbers can fill it downwards */
    .claim-screen {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: #ffffff;
      color: #101828;
    }

    /* The title bar: CINEMAX on the left, the title in the middle */
    .claim-head {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
      padding: clamp(12px, 2vw, 28px) clamp(16px, 3vw, 48px);
      border-bottom: 2px solid #e5e7eb;
    }

    .claim-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: clamp(16px, 1.8vw, 28px);
      font-weight: 900;
      letter-spacing: 1px;
    }

    .claim-brand img {
      width: clamp(32px, 3vw, 56px);
      height: auto;
    }

    .claim-head h1 {
      font-size: clamp(26px, 3.6vw, 64px);
      font-weight: 900;
      text-align: center;
    }

    .claim-fullscreen {
      justify-self: end;
      padding: 8px 14px;
      background-color: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      color: #6a7282;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .claim-fullscreen:hover {
      border-color: #fb2c36;
      color: #fb2c36;
    }

    .claim-fullscreen[hidden] {
      display: none;
    }

    /* The two columns, Preparing and Ready, split by a line and filling the
       rest of the screen */
    .claim-board {
      display: grid;
      flex: 1;
      min-height: 0;
      grid-template-columns: 1fr 1fr;
    }

    .claim-column {
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      padding: clamp(16px, 2.5vw, 40px) clamp(16px, 3vw, 48px);
    }

    .claim-column + .claim-column {
      border-left: 2px solid #e5e7eb;
    }

    /* PREPARING and READY, centred over their columns */
    .claim-column h2 {
      margin-bottom: clamp(12px, 2vw, 32px);
      font-size: clamp(18px, 2.4vw, 40px);
      font-weight: 900;
      letter-spacing: 3px;
      text-align: center;
      text-transform: uppercase;
    }

    .claim-preparing h2 {
      color: #e7000b;
    }

    .claim-ready h2 {
      color: #00a36c;
    }

    /* The order numbers (001), one under another down the whole height of the
       screen; when a column is full they carry on in a new one beside it */
    .claim-list {
      display: flex;
      flex: 1;
      flex-direction: column;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 0.1em 1.4em;
      min-height: 0;
      margin: 0;
      padding: 0;
      font-size: clamp(28px, min(4.6vw, 8vh), 84px);
      list-style: none;
    }

    .claim-list li {
      font-weight: 900;
      line-height: 1.2;
      white-space: nowrap;
    }

    .claim-preparing li {
      color: #101828;
    }

    .claim-ready li {
      color: #00a36c;
    }

    /* A number that has just become ready blinks a few times */
    .claim-ready li.claim-new {
      animation: claim-arrive 1s ease-in-out 4;
    }

    @keyframes claim-arrive {
      50% {
        opacity: 0.15;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .claim-ready li.claim-new {
        animation: none;
      }
    }

    /* When the lists cannot be updated (signed out, connection lost) */
    .claim-problem {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 16px;
      border-radius: 12px;
      background-color: #fef9c2;
      color: #a65f00;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
    }

    .claim-problem[hidden] {
      display: none;
    }

    /* On a narrow screen the columns stack, each a plain list going down, and
       the page scrolls if it has to */
    @media (max-width: 620px) {
      .claim-screen {
        height: auto;
        min-height: 100vh;
      }

      .claim-column {
        overflow: visible;
      }

      .claim-list {
        flex-wrap: nowrap;
      }

      .claim-head {
        grid-template-columns: 1fr;
        justify-items: center;
      }

      .claim-fullscreen {
        justify-self: center;
      }

      .claim-board {
        grid-template-columns: 1fr;
        align-content: start;
      }

      .claim-column + .claim-column {
        border-left: none;
        border-top: 2px solid #e5e7eb;
      }
    }
  </style>
</head>
<body>
  <div class="claim-screen" id="claim-screen">

    <header class="claim-head">
      <p class="claim-brand"><img src="photo/logo.png" alt="" width="49" height="44">CINEMAX</p>
      <h1>Snacks Claim</h1>
      <button class="claim-fullscreen" id="claim-fullscreen" type="button" hidden>Full screen</button>
    </header>

    <main class="claim-board">
      <section class="claim-column claim-preparing">
        <h2>Preparing</h2>
        <ol class="claim-list" id="claim-preparing" aria-live="polite">
          <li>002</li>
          <li>004</li>
        </ol>
      </section>
      <section class="claim-column claim-ready">
        <h2>Ready</h2>
        <ol class="claim-list" id="claim-ready" aria-live="polite">
          <li>003</li>
        </ol>
      </section>
    </main>

    <!-- Shown by claim-monitor.js when the lists cannot be updated -->
    <p class="claim-problem" id="claim-problem" role="status" hidden></p>

  </div>
  <script>
    // A button to fill the whole screen, where the browser allows it. It
    // hides itself while the page is full screen.
    (function () {
      var fullButton = document.getElementById('claim-fullscreen');
      var page = document.documentElement;
      if (fullButton && page.requestFullscreen) {
        fullButton.hidden = false;
        fullButton.addEventListener('click', function () {
          page.requestFullscreen().catch(function () {});
        });
        document.addEventListener('fullscreenchange', function () {
          fullButton.hidden = Boolean(document.fullscreenElement);
        });
      }
    })();
  </script>
</body>
</html>
