<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In</title>
  <link rel="icon" type="image/png" href="photo/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="cinemax.css">
</head>
<body>
  <header class="top-bar">
    <div class="top-bar-inner">

      <a class="logo" href="index.html"><img class="logo-mark" src="photo/logo.png" alt="" width="49" height="44">CINEMAX</a>

      <input class="menu-checkbox" type="checkbox" id="menu-open" aria-label="Menu">
      <label class="menu-toggle" for="menu-open"><span></span></label>

      <div class="bar-nav">
        <nav class="menu">
          <a href="index.html#now-showing">Now Showing</a>
          <a href="index.html#coming-soon">Upcoming Shows</a>
        </nav>

        <div class="auth-buttons">
          <a class="button button-outline" href="signin.html">Sign In</a>
          <a class="button button-red" href="signup.html">Sign Up</a>
        </div>
      </div>

    </div>
  </header>
  <main class="form-page">
    <div class="form-card">

      <h1>Welcome back</h1>
      <p class="form-intro">Sign in to book your seats.</p>


      <form id="signin-form" novalidate>
        <div class="form-field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" value=""
                 placeholder="juandelacruz@gmail.com" maxlength="190"
                 autocomplete="email" required autofocus>
        </div>

        <div class="form-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" maxlength="128"
                 autocomplete="current-password" required>
        </div>

        <button class="button button-red" type="submit" id="submit">Sign In</button>

      </form>

      <p class="form-switch">Don't have an account? <a href="signup.html" id="signup-link">Create account</a></p>

    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <a class="logo" href="index.html"><img class="logo-mark" src="photo/logo.png" alt="" width="49" height="44">CINEMAX</a>
      <p class="footer-text">
        Your next movie experience starts here. <br>
        Book your seats, enjoy your snacks, and let the show begin.
      </p>
      <p class="footer-copyright">&copy; 2026 Cinemax. All rights reserved. <a href="terms.html">Terms of Service</a></p>
    </div>
  </footer>
</body>
</html>
