<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Cinemax</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">

  <style>

    /* Styles that every page of the website uses */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background-color: #f9fafb;
      color: #101828;
      font-family: 'Outfit', Arial, sans-serif;
      font-size: 16px;
      line-height: 1.6;
    }

    h1, h2, h3 {
      margin: 0;
      font-weight: 900;
      line-height: 1.2;
    }

    p {
      margin: 0;
    }

    a {
      color: #fb2c36;
    }

    img {
      display: block;
      max-width: 100%;
    }

    /* Buttons */

    .button {
      display: inline-block;
      padding: 10px 16px;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    .button-red {
      background-color: #fb2c36;
      color: #ffffff;
    }

    .button-red:hover {
      background-color: #e7000b;
    }

    .button-outline {
      background-color: #ffffff;
      color: #101828;
      border: 1px solid #e5e7eb;
      font-weight: 600;
    }

    .button-outline:hover {
      background-color: #f9fafb;
    }

    .button-grey {
      background-color: #e5e7eb;
      color: #99a1af;
    }

    .button-wide {
      display: block;
      width: 100%;
    }

    /* Top bar */

    .top-bar {
      background-color: #ffffff;
      border-bottom: 1px solid #f3f4f6;
    }

    .top-bar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      max-width: 1280px;
      width: 96%;
      height: 64px;
      margin: 0 auto;
    }

    .logo {
      color: #101828;
      font-size: 20px;
      font-weight: 900;
      text-decoration: none;
    }

    .menu {
      display: flex;
      gap: 2px;
    }

    .menu a {
      padding: 8px 16px;
      border-radius: 12px;
      color: #6a7282;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }

    .menu a:hover {
      background-color: #f9fafb;
      color: #101828;
    }

    .auth-buttons {
      display: flex;
      gap: 8px;
    }

    /* Footer */

    .site-footer {
      background-color: #ffffff;
      border-top: 1px solid #e5e7eb;
      padding: 36px 20px 28px 20px;
    }

    .footer-inner {
      max-width: 620px;
      margin: 0 auto;
      text-align: center;
    }

    .footer-inner .logo {
      display: inline-block;
      margin-bottom: 10px;
    }

    .footer-text {
      color: #6a7282;
      font-size: 13px;
    }

    .footer-copyright {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #f3f4f6;
      color: #99a1af;
      font-size: 12px;
    }

    @media (max-width: 620px) {
      .top-bar-inner {
        height: auto;
        padding: 12px 0 12px 0;
        flex-wrap: wrap;
        justify-content: center;
      }
    }

    /* Styles for the sign in and sign up boxes */

    .form-page {
      padding: 56px 20px 80px 20px;
    }

    .form-card {
      max-width: 448px;
      margin: 0 auto;
      padding: 32px;
      background-color: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 24px;
    }

    .form-card h1 {
      font-size: 24px;
      margin-bottom: 4px;
    }

    .form-intro {
      color: #6a7282;
      font-size: 14px;
      margin-bottom: 24px;
    }

    /* One question in the form */

    .form-field {
      margin-bottom: 16px;
    }

    .form-field label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .form-field input {
      width: 100%;
      padding: 12px 16px;
      background-color: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      color: #101828;
    }

    .form-field input::placeholder {
      color: #99a1af;
      font-weight: 500;
    }

    .form-field input:focus {
      outline: none;
      border-color: #fb2c36;
    }

    /* The "I agree" tick box */

    .agree-line {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      color: #6a7282;
      font-size: 13px;
      margin: 18px 0 18px 0;
    }

    .agree-line input {
      width: 16px;
      height: 16px;
      margin-top: 3px;
      accent-color: #fb2c36;
    }

    /* The big button and the link below it */

    .form-card .button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 900;
      border-radius: 16px;
    }

    .form-switch {
      text-align: center;
      color: #6a7282;
      font-size: 14px;
      margin-top: 16px;
    }

    .form-switch a {
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <!-- Top bar -->
  <header class="top-bar">
    <div class="top-bar-inner">

      <a class="logo" href="index.html">CINEMAX</a>

      <nav class="menu">
        <a href="index.html#now-showing">Now Showing</a>
        <a href="index.html#coming-soon">Upcoming Shows</a>
        <!-- Staff page link, hidden from customers
        <a href="admin.html">Admin</a>
        -->
      </nav>

      <div class="auth-buttons">
        <a class="button button-outline" href="signin.html">Sign In</a>
        <a class="button button-red" href="signup.html">Sign Up</a>
      </div>

    </div>
  </header>

  <main class="form-page">
    <div class="form-card">

      <h1>Join CINEMAX</h1>
      <p class="form-intro">Create an account to start booking.</p>

      <form action="signin.html" method="get">

        <div class="form-field">
          <label for="fullname">Full name</label>
          <input id="fullname" name="fullname" type="text" placeholder="Juan Dela Cruz" required>
        </div>

        <div class="form-field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" placeholder="juandelacruz@gmail.com" required>
        </div>

        <div class="form-field">
          <label for="mobile">Mobile number</label>
          <input id="mobile" name="mobile" type="tel" placeholder="0917 123 4567">
        </div>

        <div class="form-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="At least 8 characters" required>
        </div>

        <div class="form-field">
          <label for="confirm">Confirm password</label>
          <input id="confirm" name="confirm" type="password" placeholder="Re-type your password" required>
        </div>

        <label class="agree-line">
          <input type="checkbox" name="agree" required>
          <span>I agree to the <a href="terms.html">Terms of Service</a>.</span>
        </label>

        <button class="button button-red" type="submit">Create Account</button>

      </form>

      <p class="form-switch">Already have an account? <a href="signin.html">Sign In</a></p>

    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-inner">

      <a class="logo" href="index.html">CINEMAX</a>

      <p class="footer-text">
        Your next movie experience starts here. <br>
        Book your seats, enjoy your snacks, and let the show begin.
      </p>

      <p class="footer-copyright">© 2026 Cinemax. All rights reserved.</p>

    </div>
  </footer>

</body>
</html>
